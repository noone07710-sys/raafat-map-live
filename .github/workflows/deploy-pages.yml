name: Deploy Raafat website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'style.css'
      - 'admin-v3.css'
      - 'theme-day.css'
      - 'raafat-finish.css'
      - 'daylight-unified.css'
      - 'arabic-export.js'
      - 'ui-dialog.js'
      - 'admin-dropdown.js'
      - 'app.js'
      - 'booking.js'
      - 'routing.js'
      - 'admin-dashboard.js'
      - 'admin/**'
      - 'brand-map.js'
      - 'google-basemap.js'
      - 'config.js'
      - 'assets/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish company website
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate JavaScript and essential UI controls
        shell: bash
        run: |
          for file in app.js routing.js booking.js admin-dashboard.js ui-dialog.js admin-dropdown.js arabic-export.js brand-map.js google-basemap.js config.js; do
            node --input-type=module --check < "$file"
          done
          node --input-type=module <<'MODULE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const code = fs.readFileSync('booking.js', 'utf8');
          const pricingFn = code.match(/export function packageForSite\(site\)\{[\s\S]*?\n\}/)?.[0];
          assert.ok(pricingFn, 'Site classification function must exist');
          const { packageForSite } = await import('data:text/javascript;base64,' + Buffer.from(pricingFn).toString('base64'));
          for (const [w,h,expected] of [[1.2,2,'A'],[2,3,'B'],[2.5,3.5,'C'],[3,4,'D']]) {
            assert.equal(packageForSite({width_m:w,height_m:h}), expected);
          }
          assert.equal(packageForSite({width_m:5,height_m:5}), null, 'Unknown sizes must not become rooftop E');
          assert.equal(packageForSite({width_m:5,height_m:5,package_class:'E'}), 'E');
          const app=fs.readFileSync('app.js','utf8');
          const admin=fs.readFileSync('admin-dashboard.js','utf8');
          assert.match(code,/clearOnEmptyMap/);
          assert.match(code,/\.eq\("status",booking\.status\)/);
          assert.match(app,/if\(currentRequest!==siteLoadSequence\)return/);
          assert.match(admin,/visibleIds\.has\(id\)/);
          assert.match(code,/booking_no/,'Booking management must use sequential numbers');
          assert.match(admin,/dashIdentityLocked/,'Staff name must be locked');
          for(const p of ['app.js','booking.js','admin-dashboard.js']){
            const src=fs.readFileSync(p,'utf8');
            assert.ok(!/\b(?:window\.)?(?:confirm|prompt|alert)\s*\(/.test(src),'Native browser dialog found in '+p);
          }
          for(const p of ['ui-dialog.js','admin-dropdown.js']){
            assert.ok(fs.existsSync(p),'Missing custom UI: '+p);
          }
          assert.match(app,/hard_delete_site/, 'Site deletion must use audited server RPC');
          assert.match(code,/hard_delete_booking/, 'Booking deletion must use audited server RPC');
          assert.match(admin,/set_my_staff_name/, 'Staff identity editor must exist');
          assert.match(admin,/activity_logs/, 'Admin activity journal must exist');
          assert.match(admin,/dashActivityRows/, 'Audit rows must render');
          assert.match(admin,/fetchAllForExport/,'Export must fetch all pages');
          assert.match(code,/enhanceAdminSelects\(modal\)/,'Customer booking dropdowns must be custom');
          assert.match(app,/STANDARD_PACKAGES/,'Fixed A-D dimensions required');
          assert.match(app,/setVisualTheme/,'Theme control required');
          assert.match(app,/recolorRaafatMap/,'Map palette must switch without navigation reset');
          const fixed=app.match(/const STANDARD_PACKAGES=Object.freeze\((\{[^;]+\})\);/);
          assert.ok(fixed,'Standard dimensions unavailable');
          const prices=JSON.parse(fixed[1].replace(/([A-D]):/g,'"$1":'));
          assert.deepEqual(prices,{A:[1.2,2],B:[2,3],C:[2.5,3.5],D:[3,4]});
          const csvCode=fs.readFileSync('arabic-export.js','utf8');
          const {makeArabicCsv,packageName}=await import('data:text/javascript;base64,'+Buffer.from(csvCode).toString('base64'));
          const sample=makeArabicCsv([{code:'A-1',name:'=2+3',width_m:1.2,height_m:2,status:'available',type:'billboard'}]);
          assert.ok(sample.startsWith('\uFEFFsep=,\r\n'),'Arabic Excel signature missing');
          assert.ok(sample.includes("\"'=2+3\""),'Formula injection not escaped');
          assert.ok(sample.includes('"متاحة"')&&sample.includes('"لوحة إعلانية"'),'Export missing Arabic translations');
          assert.ok(!sample.includes('"available"')&&!sample.includes('"billboard"'),'Raw English enums leaked');
          assert.equal(packageName({width_m:2,height_m:3}),'B');
          const bookingSample=makeArabicCsv([{booking_no:5,phone:'07801234567',status:'pending',created_at:'2026-11-09T09:00:00Z'}],'bookings');
          assert.ok(bookingSample.includes('RA-5'),'Short booking reference absent');
          assert.ok(bookingSample.includes('07801234567'),'Iraqi phone corrupted');
          assert.ok(bookingSample.includes('"بانتظار المراجعة"'),'Booking state translation missing');
          // Customer-booking regression: dropdowns MUST render over the z=13000
          // booking backdrop and must remain open when scrolling the form.
          const dropdown=fs.readFileSync('admin-dropdown.js','utf8');
          const theme=fs.readFileSync('theme-day.css','utf8');
          assert.match(dropdown,/menu\.style\.zIndex="25000"/,'Select portal must clear booking modal');
          assert.match(theme,/\.raafat-select-menu\s*\{z-index:25000!important/,'Custom menus must have high stacking order');
          assert.match(dropdown,/schedulePosition\(\)/,'Modal scroll must reposition dropdown, not close it');
          assert.match(dropdown,/filter\(option=>!option\.hidden\)/,'Hidden months must stay hidden');
          assert.match(dropdown,/focus\(\{preventScroll:true\}\)/,'Opening a dropdown must not scroll the modal away');
          assert.match(dropdown,/select\.setAttribute\("aria-hidden","true"\)/,'Native select must not steal user touch');
          assert.match(theme,/#bookingModal select\.raafat-native-select\s*\{\s*display:none!important/,'Native picker must be hidden');
          assert.match(app,/state\.osmBasemap=osm/,'OSM layer must persist for daytime switching');
          assert.match(app,/fetchRaafatMapStyle\(config\.cartoApiKey,\{arabicEnabled,theme:visualTheme\(\)\}\)/,'Both themes must use premium vector basemap');
          assert.match(app,/recolorRaafatMap\(renderer,next\)/,'Daytime map should recolor same basemap');
          assert.ok(!app.includes('if(visualTheme()==="day")revealFallbackIfReady()'),'Day mode must not switch to plain OSM');
          assert.match(theme,/#bookingModal \.booking-modal-head\s*\{\s*position:relative!important/,'Booking header must not follow page scroll');
          assert.match(theme,/html\[data-raafat-theme="day"\] \.header \.logo img/,'Day mode logo must be restored');
          assert.match(theme,/html\[data-raafat-theme="day"\] \.details \.detail-empty/,'Day mode empty cards must be legible');
          const finishCss=fs.readFileSync('raafat-finish.css','utf8');
          assert.match(finishCss,/html\[data-raafat-theme="day"\] \.browse \.location-card/,'Day listing must have readable cards');
          assert.match(finishCss,/html\[data-raafat-theme="day"\] \.vip-site-metric/,'Day metrics need matching text contrast');
          assert.match(finishCss,/#siteModal \.raafat-package-card-grid/,'Editor package cards required');
          assert.match(finishCss,/#siteModal \.modal\.wide>\.modal-head/,'Editor header must scroll naturally');
          assert.match(fs.readFileSync('app.js','utf8'),/data-raafat-package/,'Package cards require click behavior');
          assert.match(fs.readFileSync('index.html','utf8'),/raafat-finish\.css/,'Final style sheet must load last');
          const unified = fs.readFileSync('daylight-unified.css','utf8');
          const htmlTheme = fs.readFileSync('index.html','utf8');
          assert.match(htmlTheme,/daylight-unified\.css/,'The unified daylight stylesheet must be linked');
          assert.ok(htmlTheme.indexOf('daylight-unified.css')>htmlTheme.indexOf('raafat-finish.css'),'Unified daylight styles must load last');
          assert.match(unified,/--day-paper:#fffcf8/,'Day theme needs a consistent ivory base');
          assert.match(unified,/--day-accent:#b66a31/,'Day theme needs copper accent');
          assert.ok(!/background:\s*(?:#(?:0[0-9a-f]{5}|1[0-9a-f]{5})|linear-gradient\([^;]*#[01][0-9a-f]{5})/i.test(unified),
            'Dark surfaces may not leak into the unified daylight stylesheet');
          for(const target of ['.panel.browse','.details .vip-site-detail','.details .vip-site-metric',
            '.browse .listing-quick-button','.browse .location-card','.browse .status',
            '#adminDashboard .raafat-admin-sidebar','#adminDashboard .raafat-overview-welcome',
            '#adminDashboard .admin-data-table','#adminDashboard .raafat-activity-table',
            '#adminDashboard .admin-staff-row','#adminDashboard .admin-settings-group',
            '#adminDashboard .admin-bulkbar','#bookingModal .booking-tier-card',
            '#bookingModal .booking-sites-picker','#siteModal .raafat-package-card',
            '.map-area .map-site-cta','.raafat-dialog-layer .raafat-dialog-card']){
            assert.ok(unified.includes(target),'No unified daylight rules for '+target);
          }
          assert.ok(!unified.includes('[data-raafat-theme="night"]'),
            'Never modify the dark theme in the daylight-only file');
          assert.match(app,/request!==premiumMapGeneration/,'An obsolete dark tile load must not override day theme');
          assert.match(theme,/#bookingModal \.booking-tier-card>strong/,'Day mode cards must use dark text');
          assert.match(theme,/#bookingModal \.booking-step-title span/,'Day mode headings must use dark text');
          const ui=fs.readFileSync('index.html','utf8');
          assert.match(ui,/id="bookingClose"[\s\S]{0,350}<svg class="raafat-booking-close-icon"/,'Booking close must have branded SVG');
          console.log('Booking, navigation and inventory regression contracts passed');
          MODULE
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const required = [
            'map', 'mapHome', 'mapNavigationToggle', 'raafatRoutePanel',
            'raafatRouteRealtime', 'raafatRouteNext', 'raafatRouteClose',
            'raafatRouteChooseStart', 'raafatRouteRemaining',
            'vipLegendToggle', 'mapSiteCTA', 'listing',
            'showAvailableOnly', 'sortByNearest',
            'dashMyNameForm', 'dashMyName', 'dashSaveMyName',
            'dashActivityTab', 'dashActivityRows', 'dashActivityCount',
            'dashActivitySearch', 'dashActivityEntity',
            'dashActivityRefresh', 'dashActivityPrev', 'dashActivityNext',
            'dashStaffName','dashIdentityLocked','dashAdminGreeting',
            'dashCurrentSection','dashBookingTotalMetric','dashBookingPendingMetric',
            'dashExportMenu','dashExportStatus','raafatThemeToggle','fDimensionHint'
          ];
          const missing = required.filter(id => !html.includes('id="' + id + '"'));
          if (missing.length) throw new Error('Missing essential UI elements: ' + missing.join(', '));
          for(const file of ['style.css','admin-v3.css','theme-day.css','raafat-finish.css','daylight-unified.css']){
            const css = fs.readFileSync(file,'utf8');
            let depth=0;
            for(const char of css){
              if(char==='{')depth++;
              else if(char==='}')depth--;
              if(depth<0)throw Error('Unbalanced CSS closing brace: '+file);
            }
            if(depth!==0)throw Error('Unbalanced CSS opening brace: '+file);
          }
          console.log('Raafat static checks passed');
          NODE

      - name: Prepare public site only
        shell: bash
        run: |
          mkdir -p _site
          cp index.html style.css admin-v3.css theme-day.css raafat-finish.css daylight-unified.css app.js booking.js routing.js admin-dashboard.js ui-dialog.js admin-dropdown.js arabic-export.js brand-map.js google-basemap.js config.js _site/
          mkdir -p _site/admin
          cp admin/index.html _site/admin/index.html
          mkdir -p _site/assets
          if [ -f assets/raafat-logo.png ]; then
            cp assets/raafat-logo.png _site/assets/raafat-logo.png
          elif [ -f "e85b3bef-3d06-423e-a284-c3d8681964bf (1).png" ]; then
            cp "e85b3bef-3d06-423e-a284-c3d8681964bf (1).png" _site/assets/raafat-logo.png
          else
            echo "The original Raafat logo file is missing" >&2
            exit 1
          fi
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload public site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
