name: Deploy Raafat website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'style.css'
      - 'app.js'
      - 'booking.js'
      - 'admin-dashboard.js'
      - 'admin/**'
      - 'brand-map.js'
      - 'google-basemap.js'
      - 'config.js'
      - 'assets/**'
      - '*.png'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect website assets
        run: |
          mkdir -p _site
          cp index.html style.css app.js booking.js admin-dashboard.js brand-map.js google-basemap.js config.js _site/
          mkdir -p _site/admin
          cp admin/index.html _site/admin/index.html
          mkdir -p _site/assets
          cp assets/raafat-logo.svg _site/assets/raafat-logo.svg
          mkdir -p _site/assets
          cp 'e85b3bef-3d06-423e-a284-c3d8681964bf (1).png' _site/assets/raafat-logo.png
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
