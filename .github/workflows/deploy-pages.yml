name: Deploy Raafat website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'style.css'
      - 'app.js'
      - 'booking.js'
      - 'routing.js'
      - 'admin-dashboard.js'
      - 'admin/**'
      - 'brand-map.js'
      - 'google-basemap.js'
      - 'config.js'
      - 'assets/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish company website
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare public site only
        shell: bash
        run: |
          mkdir -p _site
          cp index.html style.css app.js booking.js routing.js admin-dashboard.js brand-map.js google-basemap.js config.js _site/
          mkdir -p _site/admin
          cp admin/index.html _site/admin/index.html
          mkdir -p _site/assets
          cp assets/raafat-logo.png _site/assets/raafat-logo.png
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload public site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
