name: Deploy Raafat website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'style.css'
      - 'app.js'
      - 'booking.js'
      - 'routing.js'
      - 'admin-dashboard.js'
      - 'admin/**'
      - 'brand-map.js'
      - 'google-basemap.js'
      - 'config.js'
      - 'assets/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish company website
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate JavaScript and essential UI controls
        shell: bash
        run: |
          for file in app.js routing.js booking.js admin-dashboard.js brand-map.js google-basemap.js config.js; do
            node --input-type=module --check < "$file"
          done
          node --input-type=module <<'MODULE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const code = fs.readFileSync('booking.js', 'utf8');
          const { packageForSite } = await import('data:text/javascript;base64,' + Buffer.from(code).toString('base64'));
          for (const [w,h,expected] of [[1.2,2,'A'],[2,3,'B'],[2.5,3.5,'C'],[3,4,'D']]) {
            assert.equal(packageForSite({width_m:w,height_m:h}), expected);
          }
          assert.equal(packageForSite({width_m:5,height_m:5}), null, 'Unknown sizes must not become rooftop E');
          assert.equal(packageForSite({width_m:5,height_m:5,package_class:'E'}), 'E');
          const app=fs.readFileSync('app.js','utf8');
          const admin=fs.readFileSync('admin-dashboard.js','utf8');
          assert.match(code,/clearOnEmptyMap/);
          assert.match(code,/\.eq\("status",booking\.status\)/);
          assert.match(app,/if\(currentRequest!==siteLoadSequence\)return/);
          assert.match(admin,/visibleIds\.has\(id\)/);
          console.log('Booking, navigation and inventory regression contracts passed');
          MODULE
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const required = [
            'map', 'mapHome', 'mapNavigationToggle', 'raafatRoutePanel',
            'raafatRouteRealtime', 'raafatRouteNext', 'raafatRouteClose',
            'raafatRouteChooseStart', 'raafatRouteRemaining',
            'vipLegendToggle', 'mapSiteCTA', 'listing',
            'showAvailableOnly', 'sortByNearest'
          ];
          const missing = required.filter(id => !html.includes('id="' + id + '"'));
          if (missing.length) throw new Error('Missing essential UI elements: ' + missing.join(', '));
          const css = fs.readFileSync('style.css', 'utf8');
          let depth = 0;
          for (const char of css) {
            if (char === '{') depth++;
            else if (char === '}') depth--;
            if (depth < 0) throw new Error('Unbalanced CSS closing brace');
          }
          if (depth !== 0) throw new Error('Unbalanced CSS opening brace');
          console.log('Raafat static checks passed');
          NODE

      - name: Prepare public site only
        shell: bash
        run: |
          mkdir -p _site
          cp index.html style.css app.js booking.js routing.js admin-dashboard.js brand-map.js google-basemap.js config.js _site/
          mkdir -p _site/admin
          cp admin/index.html _site/admin/index.html
          mkdir -p _site/assets
          if [ -f assets/raafat-logo.png ]; then
            cp assets/raafat-logo.png _site/assets/raafat-logo.png
          elif [ -f "e85b3bef-3d06-423e-a284-c3d8681964bf (1).png" ]; then
            cp "e85b3bef-3d06-423e-a284-c3d8681964bf (1).png" _site/assets/raafat-logo.png
          else
            echo "The original Raafat logo file is missing" >&2
            exit 1
          fi
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload public site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
